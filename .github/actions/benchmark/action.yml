name: "SDK Benchmark"
description: "Run Sentry SDK benchmarks comparing baseline vs latest release vs current branch"

inputs:
  app:
    description: "App to benchmark (e.g. python/django, go/net-http)"
    required: true
  sdk-version:
    description: "SDK version or install specifier (current branch)"
    required: true
  latest-sdk-version:
    description: "Latest stable SDK version for 3-way comparison"
    required: false
  iterations:
    description: "Number of benchmark iterations"
    required: false
    default: "5"
  post-comment:
    description: "Post results as a PR comment (true/false)"
    required: false
    default: "true"

outputs:
  overhead-p50:
    description: "P50 latency overhead percentage (current branch vs baseline)"
    value: ${{ steps.bench.outputs.overhead-p50 }}
  overhead-p99:
    description: "P99 latency overhead percentage (current branch vs baseline)"
    value: ${{ steps.bench.outputs.overhead-p99 }}
  regression:
    description: "Whether a regression was detected (true/false)"
    value: ${{ steps.bench.outputs.regression }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install bench CLI
      shell: bash
      run: pip install -e ${{ github.action_path }}/../../..

    - name: Run benchmark
      id: bench
      shell: bash
      env:
        BENCH_APP: ${{ inputs.app }}
        BENCH_SDK_VERSION: ${{ inputs.sdk-version }}
        BENCH_LATEST_SDK_VERSION: ${{ inputs.latest-sdk-version }}
        BENCH_ITERATIONS: ${{ inputs.iterations }}
      run: |
        LATEST_FLAG=""
        if [ -n "$BENCH_LATEST_SDK_VERSION" ]; then
          LATEST_FLAG="--latest-sdk-version=$BENCH_LATEST_SDK_VERSION"
        fi

        bench run "$BENCH_APP" \
          --sdk-version="$BENCH_SDK_VERSION" \
          $LATEST_FLAG \
          --iterations="$BENCH_ITERATIONS" \
          --output-dir=results/

        # Runner writes to results/{lang}-{framework}/results.json
        RESULTS_FILE=$(find results/ -maxdepth 2 -name 'results.json' -type f | head -1)
        # Sanitize app name for artifact upload (slashes not allowed)
        echo "artifact-name=benchmark-results-$(echo "$BENCH_APP" | tr '/' '-')" >> "$GITHUB_OUTPUT"
        if [ -n "$RESULTS_FILE" ]; then
          echo "results-file=${RESULTS_FILE}" >> "$GITHUB_OUTPUT"
          echo "overhead-p50=$(python -c "
        import json
        with open('${RESULTS_FILE}') as f:
            data = json.load(f)
        comparisons = data.get('summary', {}).get('comparisons', {})
        cb = comparisons.get('current_branch', {})
        print(cb.get('overhead', {}).get('p50', 'N/A'))
        ")" >> "$GITHUB_OUTPUT"
          echo "overhead-p99=$(python -c "
        import json
        with open('${RESULTS_FILE}') as f:
            data = json.load(f)
        comparisons = data.get('summary', {}).get('comparisons', {})
        cb = comparisons.get('current_branch', {})
        print(cb.get('overhead', {}).get('p99', 'N/A'))
        ")" >> "$GITHUB_OUTPUT"
          echo "regression=$(python -c "
        import json
        with open('${RESULTS_FILE}') as f:
            data = json.load(f)
        print(str(data.get('summary', {}).get('regression', False)).lower())
        ")" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ steps.bench.outputs.artifact-name }}
        path: results/

    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RESULTS_FILE="${{ steps.bench.outputs.results-file }}"
        if [ -n "$RESULTS_FILE" ]; then
          bench post-comment \
            --repo="${{ github.repository }}" \
            --pr="${{ github.event.pull_request.number }}" \
            --results-file="$RESULTS_FILE"
        fi
