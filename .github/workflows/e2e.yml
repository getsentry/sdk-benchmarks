name: "E2E benchmarks"

on:
  workflow_call:
    inputs:
      language:
        description: "Language to benchmark (auto-detected from repo name if not provided)"
        required: false
        type: string
      sdk-version:
        description: "SDK version (resolves latest if not provided)"
        required: false
        type: string
      iterations:
        description: "Number of benchmark iterations"
        required: false
        type: number
        default: 10
      benchmarks-ref:
        description: "Git ref of sdk-benchmarks to checkout (must match the ref used in the caller's uses: directive)"
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      language:
        description: "Language to benchmark (e.g. go, python)"
        required: true
      sdk-version:
        description: "SDK version (e.g. 0.42.0 or latest)"
        default: "latest"

jobs:
  discover:
    if: github.repository != 'getsentry/sdk-benchmarks'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.apps }}
      iterations: ${{ steps.iterations.outputs.list }}
      sdk-version: ${{ steps.version.outputs.sdk-version }}
      latest-sdk-version: ${{ steps.latest.outputs.latest-sdk-version }}
      benchmarks-ref: ${{ inputs.benchmarks-ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getsentry/sdk-benchmarks
          ref: ${{ inputs.benchmarks-ref || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bench CLI
        run: pip install -e .

      - name: Detect language
        id: lang
        env:
          INPUT_LANGUAGE: ${{ inputs.language }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_LANGUAGE" ]; then
            echo "language=$INPUT_LANGUAGE" >> "$GITHUB_OUTPUT"
          else
            # Extract language from repo name: getsentry/sentry-go → go
            REPO_NAME="${CALLER_REPO##*/}"
            LANGUAGE="${REPO_NAME#sentry-}"
            echo "language=$LANGUAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve SDK version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.sdk-version }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
        run: |
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "latest" ]; then
            echo "sdk-version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(bench resolve-version "$LANGUAGE")
            echo "sdk-version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve latest stable SDK version
        id: latest
        env:
          LANGUAGE: ${{ steps.lang.outputs.language }}
        run: |
          LATEST=$(bench resolve-version "$LANGUAGE")
          echo "latest-sdk-version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        env:
          LANGUAGE: ${{ steps.lang.outputs.language }}
        run: |
          APPS=$(bench list-apps "$LANGUAGE")
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

      - name: Build iterations list
        id: iterations
        env:
          ITERATIONS: ${{ inputs.iterations || 10 }}
        run: |
          # Generate [1, 2, ..., N] as JSON array
          LIST=$(python -c "import json; print(json.dumps(list(range(1, int('$ITERATIONS') + 1))))")
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  bench:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix) }}
        iteration: ${{ fromJSON(needs.discover.outputs.iterations) }}
    uses: ./.github/workflows/benchmark.yml
    with:
      app: ${{ matrix.app }}
      sdk-version: ${{ needs.discover.outputs.sdk-version }}
      latest-sdk-version: ${{ needs.discover.outputs.latest-sdk-version }}
      iteration: ${{ matrix.iteration }}
      benchmarks-ref: ${{ needs.discover.outputs.benchmarks-ref }}

  summary:
    needs: [discover, bench]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getsentry/sdk-benchmarks
          ref: ${{ needs.discover.outputs.benchmarks-ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bench CLI
        run: pip install -e .

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: all-results/
          merge-multiple: false

      - name: Aggregate iteration results per app
        run: |
          # Artifacts are at all-results/benchmark-results-{app}-iter{N}/{lang}-{framework}/iteration-{N}.json
          # Group iteration files by app dir (e.g. go-gin) and aggregate into results.json
          mkdir -p combined-results

          # Collect all iteration JSON files grouped by app directory
          for iter_file in $(find all-results/ -name 'iteration-*.json' -type f); do
            # Extract the lang-framework dir name (e.g. go-gin)
            app_dir=$(basename "$(dirname "$iter_file")")
            mkdir -p "per-app/${app_dir}"
            cp "$iter_file" "per-app/${app_dir}/"
          done

          # Aggregate each app's iterations into a single results.json
          for app_dir in per-app/*/; do
            app_name=$(basename "$app_dir")
            bench aggregate \
              --iterations-dir="$app_dir" \
              --output-dir="combined-results/${app_name}"
          done

      - name: Post combined PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bench post-summary \
            --repo="${{ github.repository }}" \
            --pr="${{ github.event.pull_request.number }}" \
            --results-dir=combined-results/
