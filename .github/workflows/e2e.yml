name: "E2E benchmarks"

on:
  workflow_call:
    inputs:
      language:
        description: "Language to benchmark (auto-detected from repo name if not provided)"
        required: false
        type: string
      sdk-version:
        description: "SDK version (resolves latest if not provided)"
        required: false
        type: string
      iterations:
        description: "Maximum number of benchmark iterations"
        required: false
        type: number
        default: 10
      benchmarks-ref:
        description: "Git ref of sdk-benchmarks to checkout (branch, tag, or SHA)"
        required: false
        type: string
        default: main
    secrets:
      BENCHMARKS_TOKEN:
        description: "GitHub token with actions:write scope on sdk-benchmarks"
        required: true
  workflow_dispatch:
    inputs:
      language:
        description: "Language to benchmark (e.g. go, python)"
        required: true
      sdk-version:
        description: "SDK version (e.g. 0.42.0 or latest)"
        default: "latest"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.apps }}
      sdk-version: ${{ steps.version.outputs.sdk-version }}
      latest-sdk-version: ${{ steps.latest.outputs.latest-sdk-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getsentry/sdk-benchmarks
          ref: ${{ inputs.benchmarks-ref || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bench CLI
        run: pip install -e .

      - name: Detect language
        id: lang
        env:
          INPUT_LANGUAGE: ${{ inputs.language }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_LANGUAGE" ]; then
            echo "language=$INPUT_LANGUAGE" >> "$GITHUB_OUTPUT"
          else
            # Extract language from repo name: getsentry/sentry-go → go
            REPO_NAME="${CALLER_REPO##*/}"
            LANGUAGE="${REPO_NAME#sentry-}"
            echo "language=$LANGUAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve SDK version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.sdk-version }}
          LANGUAGE: ${{ steps.lang.outputs.language }}
        run: |
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "latest" ]; then
            echo "sdk-version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(bench resolve-version "$LANGUAGE")
            echo "sdk-version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve latest stable SDK version
        id: latest
        env:
          LANGUAGE: ${{ steps.lang.outputs.language }}
        run: |
          LATEST=$(bench resolve-version "$LANGUAGE")
          echo "latest-sdk-version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        env:
          LANGUAGE: ${{ steps.lang.outputs.language }}
        run: |
          APPS=$(bench list-apps "$LANGUAGE")
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  bench:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/benchmark.yml
    with:
      app: ${{ matrix.app }}
      sdk-version: ${{ needs.discover.outputs.sdk-version }}
      latest-sdk-version: ${{ needs.discover.outputs.latest-sdk-version }}
      iterations: ${{ inputs.iterations || 10 }}
      benchmarks-ref: ${{ inputs.benchmarks-ref || 'main' }}
    secrets:
      BENCHMARKS_TOKEN: ${{ secrets.BENCHMARKS_TOKEN }}

  summary:
    needs: bench
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getsentry/sdk-benchmarks
          ref: ${{ inputs.benchmarks-ref || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bench CLI
        run: pip install -e .

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: all-results/
          merge-multiple: false

      - name: Post combined PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each artifact extracts to all-results/<artifact-name>/...
          # The results.json files are at <artifact>/*/results.json (depth 2)
          # Flatten them into a single directory structure for post-summary
          mkdir -p combined-results
          for results_file in $(find all-results/ -maxdepth 3 -name 'results.json' -path '*/results.json' ! -path '*/iter-*/results.json'); do
            # Extract app dir name (e.g. go-gin) from the path
            app_dir=$(basename "$(dirname "$results_file")")
            mkdir -p "combined-results/${app_dir}"
            cp "$results_file" "combined-results/${app_dir}/results.json"
          done

          bench post-summary \
            --repo="${{ github.repository }}" \
            --pr="${{ github.event.pull_request.number }}" \
            --results-dir=combined-results/
