name: Benchmark

on:
  workflow_call:
    inputs:
      app:
        description: "App to benchmark (e.g. python/django, go/net-http)"
        required: true
        type: string
      sdk-version:
        description: "SDK version or install specifier to benchmark (current branch)"
        required: true
        type: string
      latest-sdk-version:
        description: "Latest stable SDK version for 3-way comparison"
        required: false
        type: string
      iterations:
        description: "Number of parallel benchmark iterations to dispatch"
        required: false
        type: number
        default: 10
      benchmarks-ref:
        description: "Git ref of sdk-benchmarks to checkout (branch, tag, or SHA)"
        required: false
        type: string
        default: main
    secrets:
      BENCHMARKS_TOKEN:
        description: "GitHub token with actions:write scope on sdk-benchmarks"
        required: true
    outputs:
      overhead-p50:
        description: "P50 latency overhead percentage"
        value: ${{ jobs.bench.outputs.overhead-p50 }}
      overhead-p99:
        description: "P99 latency overhead percentage"
        value: ${{ jobs.bench.outputs.overhead-p99 }}
      regression:
        description: "Whether a regression was detected"
        value: ${{ jobs.bench.outputs.regression }}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      overhead-p50: ${{ steps.results.outputs.overhead-p50 }}
      overhead-p99: ${{ steps.results.outputs.overhead-p99 }}
      regression: ${{ steps.results.outputs.regression }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getsentry/sdk-benchmarks
          ref: ${{ inputs.benchmarks-ref || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bench CLI
        run: pip install -e .

      - name: Orchestrate parallel benchmarks
        env:
          BENCH_APP: ${{ inputs.app }}
          BENCH_SDK_VERSION: ${{ inputs.sdk-version }}
          BENCH_LATEST_SDK_VERSION: ${{ inputs.latest-sdk-version }}
          BENCH_ITERATIONS: ${{ inputs.iterations }}
          BENCH_BENCHMARKS_REF: ${{ inputs.benchmarks-ref || 'main' }}
          BENCHMARKS_TOKEN: ${{ secrets.BENCHMARKS_TOKEN }}
          CALLER_RUN_ID: ${{ github.run_id }}
        run: |
          LATEST_FLAG=""
          if [ -n "$BENCH_LATEST_SDK_VERSION" ]; then
            LATEST_FLAG="--latest-sdk-version=$BENCH_LATEST_SDK_VERSION"
          fi

          bench orchestrate "$BENCH_APP" \
            --sdk-version="$BENCH_SDK_VERSION" \
            $LATEST_FLAG \
            --iterations="$BENCH_ITERATIONS" \
            --output-dir=results/ \
            --benchmarks-ref="$BENCH_BENCHMARKS_REF" \
            --token="$BENCHMARKS_TOKEN" \
            --caller-run-id="$CALLER_RUN_ID"

      - name: Find results file
        id: find-results
        env:
          BENCH_APP: ${{ inputs.app }}
        run: |
          # Runner writes to results/{lang}-{framework}/results.json (depth 2);
          # deeper results.json files are raw vegeta NDJSON.
          RESULTS_FILE=$(find results/ -maxdepth 2 -name 'results.json' -type f | head -1)
          echo "path=${RESULTS_FILE}" >> "$GITHUB_OUTPUT"
          # Sanitize app name for artifact upload (slashes not allowed)
          ARTIFACT_NAME="benchmark-results-$(echo "$BENCH_APP" | tr '/' '-')"
          echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Parse results
        id: results
        if: steps.find-results.outputs.path != ''
        run: |
          RESULTS_FILE="${{ steps.find-results.outputs.path }}"
          echo "overhead-p50=$(python -c "
          import json
          with open('$RESULTS_FILE') as f:
              data = json.load(f)
          comparisons = data.get('summary', {}).get('comparisons', {})
          cb = comparisons.get('current_branch', {})
          print(cb.get('overhead', {}).get('p50', 'N/A'))
          ")" >> "$GITHUB_OUTPUT"
          echo "overhead-p99=$(python -c "
          import json
          with open('$RESULTS_FILE') as f:
              data = json.load(f)
          comparisons = data.get('summary', {}).get('comparisons', {})
          cb = comparisons.get('current_branch', {})
          print(cb.get('overhead', {}).get('p99', 'N/A'))
          ")" >> "$GITHUB_OUTPUT"
          echo "regression=$(python -c "
          import json
          with open('$RESULTS_FILE') as f:
              data = json.load(f)
          print(str(data.get('summary', {}).get('regression', False)).lower())
          ")" >> "$GITHUB_OUTPUT"

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.find-results.outputs.artifact-name }}
          path: results/
