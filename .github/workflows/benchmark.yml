name: Benchmark

on:
  workflow_call:
    inputs:
      app:
        description: "App to benchmark (e.g. python/django, go/net-http)"
        required: true
        type: string
      sdk-version:
        description: "SDK version or install specifier to benchmark (current branch)"
        required: true
        type: string
      latest-sdk-version:
        description: "Latest stable SDK version for 3-way comparison"
        required: false
        type: string
      iteration:
        description: "Iteration number to run"
        required: true
        type: number
      benchmarks-ref:
        description: "Git ref of sdk-benchmarks to checkout"
        required: false
        type: string
        default: main
    outputs:
      overhead-p50:
        description: "P50 latency overhead percentage"
        value: ${{ jobs.bench.outputs.overhead-p50 }}
      overhead-p99:
        description: "P99 latency overhead percentage"
        value: ${{ jobs.bench.outputs.overhead-p99 }}
      regression:
        description: "Whether a regression was detected"
        value: ${{ jobs.bench.outputs.regression }}

jobs:
  bench:
    runs-on: ubuntu-latest
    outputs:
      overhead-p50: ${{ steps.results.outputs.overhead-p50 }}
      overhead-p99: ${{ steps.results.outputs.overhead-p99 }}
      regression: ${{ steps.results.outputs.regression }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getsentry/sdk-benchmarks
          ref: ${{ inputs.benchmarks-ref || github.job_workflow_sha }}

      - uses: actions/setup-go@v5
        if: startsWith(inputs.app, 'go/')
        with:
          go-version: "1.25"
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bench CLI
        run: pip install -e .

      - name: Run single iteration
        env:
          BENCH_APP: ${{ inputs.app }}
          BENCH_SDK_VERSION: ${{ inputs.sdk-version }}
          BENCH_LATEST_SDK_VERSION: ${{ inputs.latest-sdk-version }}
          BENCH_ITERATION: ${{ inputs.iteration }}
        run: |
          LATEST_FLAG=""
          if [ -n "$BENCH_LATEST_SDK_VERSION" ]; then
            LATEST_FLAG="--latest-sdk-version=$BENCH_LATEST_SDK_VERSION"
          fi

          bench run-iteration "$BENCH_APP" \
            --sdk-version="$BENCH_SDK_VERSION" \
            $LATEST_FLAG \
            --iteration="$BENCH_ITERATION" \
            --output-dir=results/

      - name: Find results file
        id: find-results
        env:
          BENCH_APP: ${{ inputs.app }}
          BENCH_ITERATION: ${{ inputs.iteration }}
        run: |
          # run-iteration writes to results/{lang}-{framework}/iteration-{N}.json
          RESULTS_FILE=$(find results/ -maxdepth 2 -name "iteration-${BENCH_ITERATION}.json" -type f | head -1)
          echo "path=${RESULTS_FILE}" >> "$GITHUB_OUTPUT"
          # Sanitize app name for artifact upload (slashes not allowed)
          ARTIFACT_NAME="benchmark-results-$(echo "$BENCH_APP" | tr '/' '-')-iter${BENCH_ITERATION}"
          echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Parse results
        id: results
        if: steps.find-results.outputs.path != ''
        run: |
          RESULTS_FILE="${{ steps.find-results.outputs.path }}"
          echo "overhead-p50=$(python -c "
          import json
          with open('$RESULTS_FILE') as f:
              data = json.load(f)
          results = data.get('results', [])
          cb = [r for r in results if r.get('variant') == 'current_branch']
          bl = [r for r in results if r.get('variant') == 'baseline']
          if cb and bl:
              cb_lat = [r['latency'] for r in cb[0].get('vegeta_results', [])]
              bl_lat = [r['latency'] for r in bl[0].get('vegeta_results', [])]
              if bl_lat:
                  import statistics
                  cb_p50 = statistics.median(cb_lat)
                  bl_p50 = statistics.median(bl_lat)
                  print(f'{((cb_p50 / bl_p50) - 1) * 100:.2f}')
              else:
                  print('N/A')
          else:
              print('N/A')
          ")" >> "$GITHUB_OUTPUT"
          echo "overhead-p99=N/A" >> "$GITHUB_OUTPUT"
          echo "regression=false" >> "$GITHUB_OUTPUT"

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.find-results.outputs.artifact-name }}
          path: results/
